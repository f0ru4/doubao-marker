<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>图片水印添加器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    padding: 0;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 0 14px;
    position: relative;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a1a;
  }

  /* 水印状态按钮 */
  .wm-status-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, box-shadow .2s;
    white-space: nowrap;
  }
  .wm-status-btn:active { opacity: .8; }

  .wm-status-btn.ready {
    background: #e8f8ee;
    color: #2a9d4e;
    box-shadow: 0 1px 4px rgba(42,157,78,.18);
  }
  .wm-status-btn.missing {
    background: #fde8e8;
    color: #d43030;
    box-shadow: 0 1px 4px rgba(212,48,48,.18);
  }
  .wm-status-btn.custom-loaded {
    background: #e8f0fd;
    color: #3478d6;
    box-shadow: 0 1px 4px rgba(52,120,214,.18);
  }

  /* 弹窗遮罩 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.show {
    display: flex;
  }

  .modal {
    position: relative;
    background: #fff;
    border-radius: 16px;
    width: 90%;
    max-width: 480px;
    padding: 28px 24px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    animation: modalIn .25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 32px;
    height: 32px;
    border: none;
    background: #f0f2f5;
    border-radius: 50%;
    font-size: 18px;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
    line-height: 1;
  }
  .modal-close:hover { background: #e2e5ea; }

  .modal-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 16px;
    padding-right: 36px;
  }

  .wm-preview-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding: 12px;
    background: #f7f8fa;
    border-radius: 10px;
  }
  .wm-preview-thumb {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 6px;
    background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 10px 10px;
    flex-shrink: 0;
  }
  .wm-preview-info {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }
  .wm-preview-info strong { color: #333; }

  /* 弹窗内的上传区 */
  .modal-upload {
    position: relative;
    border: 2px dashed #c0c4cc;
    border-radius: 10px;
    background: #fafbfc;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .modal-upload:hover,
  .modal-upload.dragover {
    border-color: #4e8cff;
    background: #f4f7ff;
  }
  .modal-upload input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }
  .modal-upload-icon {
    font-size: 32px;
    color: #a0a8b8;
    margin-bottom: 8px;
    display: block;
  }
  .modal-upload-text {
    font-size: 14px;
    color: #888;
    line-height: 1.5;
  }

  .wm-opacity-row {
    margin-top: 16px;
    padding: 12px;
    background: #f7f8fa;
    border-radius: 10px;
  }
  .wm-opacity-row label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .wm-opacity-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wm-opacity-value {
    min-width: 42px;
    font-size: 13px;
    font-weight: 600;
    color: #4e8cff;
    text-align: right;
  }
  input[type="range"].wm-opacity-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: #dde1e8;
    outline: none;
  }
  input[type="range"].wm-opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4e8cff;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(78,140,255,.3);
  }
  input[type="range"].wm-opacity-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4e8cff;
    cursor: pointer;
    border: none;
    box-shadow: 0 1px 4px rgba(78,140,255,.3);
  }

  /* 主上传区域 */
  .upload-area {
    position: relative;
    border: 2px dashed #c0c4cc;
    border-radius: 12px;
    background: #fff;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .upload-area:hover,
  .upload-area.dragover {
    border-color: #4e8cff;
    background: #f4f7ff;
  }
  .upload-area input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }
  .upload-icon {
    font-size: 40px;
    color: #a0a8b8;
    margin-bottom: 10px;
    display: block;
  }
  .upload-text {
    font-size: 15px;
    color: #666;
    line-height: 1.6;
  }
  .upload-text strong { color: #4e8cff; }

  /* 控制面板 */
  .controls {
    display: none;
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    margin-top: 14px;
  }
  .controls.show { display: block; }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .control-row label {
    font-size: 14px;
    color: #555;
    white-space: nowrap;
    min-width: 90px;
  }

  .slider-wrap {
    flex: 1;
    min-width: 160px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: #dde1e8;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4e8cff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(78,140,255,.35);
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4e8cff;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 6px rgba(78,140,255,.35);
  }

  .size-value {
    font-size: 14px;
    font-weight: 600;
    color: #4e8cff;
    min-width: 50px;
    text-align: right;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 120px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:active { opacity: .8; }

  .btn-download {
    background: #4e8cff;
    color: #fff;
  }
  .btn-reset {
    background: #f0f2f5;
    color: #555;
    border: 1px solid #ddd;
  }

  /* 预览区域 */
  .preview-area {
    display: none;
    margin-top: 14px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    overflow: hidden;
  }
  .preview-area.show { display: block; }

  .preview-title {
    font-size: 14px;
    color: #888;
    margin-bottom: 12px;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    overflow: auto;
    border-radius: 8px;
    background: repeating-conic-gradient(#f0f0f0 0% 25%, #fff 0% 50%) 50% / 16px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 200px;
  }

  canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  /* 响应式 */
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .header { padding: 14px 0 10px; }
    h1 { font-size: 18px; }
    .wm-status-btn { position: static; transform: none; margin-top: 8px; font-size: 12px; padding: 6px 10px; }
    .header { flex-wrap: wrap; justify-content: center; }
    .upload-area { padding: 28px 16px; }
    .upload-icon { font-size: 34px; }
    .controls { padding: 14px 14px; }
    .control-row { gap: 8px; }
    .control-row label { min-width: 70px; font-size: 13px; }
    .btn { padding: 11px 14px; font-size: 14px; }
    .modal { padding: 22px 18px 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>图片水印添加器</h1>
    <button class="wm-status-btn" id="wmStatusBtn">检测中...</button>
  </div>

  <!-- 上传待处理图片 -->
  <div class="upload-area" id="uploadArea">
    <span class="upload-icon">&#128247;</span>
    <div class="upload-text">
      点击或拖拽上传图片<br>
      <strong>支持 JPG / PNG / WebP</strong>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- 控制 -->
  <div class="controls" id="controls">
    <div class="control-row">
      <label>水印大小</label>
      <div class="slider-wrap">
        <input type="range" id="scaleSlider" min="2" max="30" value="8" step="0.5">
        <span class="size-value" id="sizeValue">8%</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-download" id="btnDownload">&#11015; 下载图片</button>
      <button class="btn btn-reset" id="btnReset">&#8635; 重新上传</button>
    </div>
  </div>

  <!-- 预览 -->
  <div class="preview-area" id="previewArea">
    <div class="preview-title">预览效果（右下角水印）</div>
    <div class="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</div>

<!-- 水印自定义弹窗 -->
<div class="modal-overlay" id="wmModal">
  <div class="modal">
    <button class="modal-close" id="wmModalClose">&times;</button>
    <div class="modal-title">自定义水印图片</div>
    <div class="wm-preview-row" id="wmPreviewRow">
      <img class="wm-preview-thumb" id="wmPreviewThumb" src="" alt="">
      <div class="wm-preview-info" id="wmPreviewInfo">
        当前水印：<strong id="wmPreviewName">doubao.png</strong><br>
        <span id="wmPreviewSize"></span>
      </div>
    </div>
    <div class="modal-upload" id="wmUploadArea">
      <span class="modal-upload-icon">&#128248;</span>
      <div class="modal-upload-text">
        点击或拖拽上传水印图片<br>
        <strong>支持 PNG（推荐） / JPG / WebP</strong>
      </div>
      <input type="file" id="wmFileInput" accept="image/*">
    </div>
    <div class="wm-opacity-row">
      <label>水印透明度</label>
      <div class="wm-opacity-wrap">
        <input type="range" class="wm-opacity-slider" id="wmOpacitySlider" min="5" max="100" value="80" step="5">
        <span class="wm-opacity-value" id="wmOpacityValue">80%</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  /* ========== DOM 引用 ========== */
  const fileInput     = document.getElementById('fileInput');
  const uploadArea    = document.getElementById('uploadArea');
  const controls      = document.getElementById('controls');
  const previewArea   = document.getElementById('previewArea');
  const canvas        = document.getElementById('canvas');
  const ctx           = canvas.getContext('2d');
  const slider        = document.getElementById('scaleSlider');
  const sizeValue     = document.getElementById('sizeValue');
  const btnDownload   = document.getElementById('btnDownload');
  const btnReset      = document.getElementById('btnReset');

  // 水印状态按钮
  const wmStatusBtn   = document.getElementById('wmStatusBtn');

  // 弹窗
  const wmModal       = document.getElementById('wmModal');
  const wmModalClose  = document.getElementById('wmModalClose');
  const wmUploadArea  = document.getElementById('wmUploadArea');
  const wmFileInput   = document.getElementById('wmFileInput');
  const wmPreviewRow  = document.getElementById('wmPreviewRow');
  const wmPreviewThumb = document.getElementById('wmPreviewThumb');
  const wmPreviewName  = document.getElementById('wmPreviewName');
  const wmPreviewSize  = document.getElementById('wmPreviewSize');
  const wmOpacitySlider = document.getElementById('wmOpacitySlider');
  const wmOpacityValue  = document.getElementById('wmOpacityValue');

  let originalImage = null;
  let watermarkImg  = null;
  let watermarkSrc  = '';   // 当前水印来源标识
  let wmDefaultReady = false; // doubao.png 是否存在
  let wmOpacity     = 0.8;   // 水印透明度，默认 80%

  /* ========== 水印状态按钮 ========== */
  function setWmStatus(state, text) {
    wmStatusBtn.className = 'wm-status-btn ' + state;
    wmStatusBtn.textContent = text;
  }

  /* ========== 加载默认水印 doubao.png ========== */
  function loadDefaultWatermark() {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        watermarkImg = img;
        watermarkSrc = 'doubao.png';
        wmDefaultReady = true;
        setWmStatus('ready', '默认水印就绪（自定义）');
        updateWmPreview(img, 'doubao.png', img.naturalWidth, img.naturalHeight);
        resolve(img);
      };
      img.onerror = function () {
        wmDefaultReady = false;
        setWmStatus('missing', '水印丢失！（自定义）');
        // 生成 fallback 文字水印
        var c = document.createElement('canvas');
        c.width = 200; c.height = 60;
        var cx = c.getContext('2d');
        cx.fillStyle = 'rgba(100,100,100,0.6)';
        cx.font = 'bold 28px sans-serif';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText('水印', 100, 30);
        var fallback = new Image();
        fallback.onload = function () {
          watermarkImg = fallback;
          watermarkSrc = 'fallback';
          updateWmPreview(fallback, '默认文字水印', 200, 60);
        };
        fallback.src = c.toDataURL();
        reject(new Error('doubao.png not found'));
      };
      img.src = 'doubao.png';
    });
  }

  /* ========== 更新弹窗内水印预览 ========== */
  function updateWmPreview(img, name, w, h) {
    wmPreviewThumb.src = img.src;
    wmPreviewName.textContent = name;
    wmPreviewSize.textContent = '尺寸：' + w + ' x ' + h + ' px';
  }

  /* ========== 绘制合成图 ========== */
  function render() {
    if (!originalImage || !watermarkImg) return;

    var srcW = originalImage.naturalWidth  || originalImage.width;
    var srcH = originalImage.naturalHeight || originalImage.height;

    canvas.width  = srcW;
    canvas.height = srcH;

    ctx.clearRect(0, 0, srcW, srcH);
    ctx.drawImage(originalImage, 0, 0, srcW, srcH);

    var pct = parseFloat(slider.value) / 100;
    var wmBaseW = watermarkImg.naturalWidth;
    var wmBaseH = watermarkImg.naturalHeight;
    var wmW = Math.round(srcW * pct);
    var wmH = Math.round(wmBaseH * (wmW / wmBaseW));

    if (wmW > srcW) wmW = srcW;
    if (wmH > srcH) { wmH = srcH; wmW = Math.round(wmBaseW * (wmH / wmBaseH)); }

    var padding = Math.max(Math.round(srcW * 0.015), 4);
    var posX = srcW - wmW - padding;
    var posY = srcH - wmH - padding;

    ctx.globalAlpha = wmOpacity;
    ctx.drawImage(watermarkImg, posX, posY, wmW, wmH);
    ctx.globalAlpha = 1.0;
  }

  /* ========== 读取用户待处理图片 ========== */
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('请选择有效的图片文件');
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        originalImage = img;
        controls.classList.add('show');
        previewArea.classList.add('show');
        render();
      };
      img.onerror = function () { alert('图片加载失败，请重试'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ========== 下载 ========== */
  function download() {
    if (!canvas.width || !canvas.height) return;
    canvas.toBlob(function (blob) {
      if (!blob) { alert('导出失败，请重试'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.download = 'watermarked.png';
      a.href = url;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    }, 'image/png');
  }

  /* ========== 弹窗控制 ========== */
  function openWmModal() { wmModal.classList.add('show'); }
  function closeWmModal() { wmModal.classList.remove('show'); }

  /* ========== 处理水印文件上传 ========== */
  function handleWmFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('请选择有效的图片文件作为水印');
      return;
    }
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        watermarkImg = img;
        watermarkSrc = file.name;
        // 更新状态按钮为蓝色"自定义已加载"
        setWmStatus('custom-loaded', '已加载：' + file.name);
        // 更新弹窗预览
        updateWmPreview(img, file.name, img.naturalWidth, img.naturalHeight);
        // 自动关闭弹窗
        setTimeout(closeWmModal, 400);
        // 如果有待处理图片，刷新预览
        if (originalImage) render();
      };
      img.onerror = function () { alert('水印图片加载失败，请重试'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ========== 事件绑定 ========== */

  // 待处理图片上传
  fileInput.addEventListener('change', function () {
    if (this.files && this.files[0]) handleFile(this.files[0]);
  });

  uploadArea.addEventListener('dragover', function (e) {
    e.preventDefault(); this.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', function () {
    this.classList.remove('dragover');
  });
  uploadArea.addEventListener('drop', function (e) {
    e.preventDefault(); this.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  // 水印状态按钮 -> 打开弹窗
  wmStatusBtn.addEventListener('click', openWmModal);

  // 弹窗关闭
  wmModalClose.addEventListener('click', closeWmModal);
  wmModal.addEventListener('click', function (e) {
    if (e.target === wmModal) closeWmModal();
  });

  // 水印文件上传
  wmFileInput.addEventListener('change', function () {
    if (this.files && this.files[0]) handleWmFile(this.files[0]);
  });

  wmUploadArea.addEventListener('dragover', function (e) {
    e.preventDefault(); this.classList.add('dragover');
  });
  wmUploadArea.addEventListener('dragleave', function () {
    this.classList.remove('dragover');
  });
  wmUploadArea.addEventListener('drop', function (e) {
    e.preventDefault(); this.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleWmFile(e.dataTransfer.files[0]);
  });

  // 水印透明度滑块
  wmOpacitySlider.addEventListener('input', function () {
    wmOpacity = parseFloat(this.value) / 100;
    wmOpacityValue.textContent = this.value + '%';
    if (originalImage && watermarkImg) render();
  });

  // 滑块
  slider.addEventListener('input', function () {
    sizeValue.textContent = this.value + '%';
    render();
  });

  // 下载
  btnDownload.addEventListener('click', download);

  // 重置
  btnReset.addEventListener('click', function () {
    originalImage = null;
    fileInput.value = '';
    controls.classList.remove('show');
    previewArea.classList.remove('show');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width  = 0;
    canvas.height = 0;
    slider.value  = 8;
    sizeValue.textContent = '8%';
  });

  /* ========== 初始化 ========== */
  loadDefaultWatermark().catch(function () {
    // fallback 已在 loadDefaultWatermark 内部处理
  });
})();
</script>
</body>
</html>
